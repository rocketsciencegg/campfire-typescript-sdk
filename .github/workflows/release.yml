name: Release
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'What changed in the API spec'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: npm ci
      - run: npx tsc
      - name: Get version
        id: version
        # A block scalar, not a one-liner. The previous form escaped its inner quotes
        # as \" inside a YAML plain scalar, which reaches bash literally and dies with
        # `syntax error near unexpected token '('`. Every release run failed on it.
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body: ${{ github.event.inputs.release_notes }}
          generate_release_notes: true
