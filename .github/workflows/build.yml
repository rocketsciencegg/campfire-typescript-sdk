name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: npm ci
      - run: npx tsc

      # `dist/` is COMMITTED, because consumers install this over `github:` and there is no
      # `prepare` build. That was the old arrangement: `prepare: npm run build` compiled at every
      # consumer's install, which pylon abandoned after it broke installs (pylon#8). With dist/
      # checked in, the committed output IS the published artifact — so it has to be verified. If
      # someone edits api.ts and forgets to rebuild, every consumer silently gets stale code and
      # nothing anywhere complains.
      - name: committed dist/ must match a fresh build
        run: git diff --exit-code dist/ || (echo "::error::dist/ is stale — run 'npx tsc' and commit dist/" && exit 1)
