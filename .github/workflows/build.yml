name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Documented values: read, write, write-only, none.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
# read restores and does not save. The pnpm-store job below is the only writer.
# actionlint 1.7.12 still reports this key as unexpected (rhysd/actionlint#762).
cache-mode: read

env:
  PNPM_VERSION: "12.20.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Exact key: lockfile hash, no restore-keys. A lockfile or pnpm bump is a miss.
      # Restore only: cache-mode is read, and this action has no save step.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc

      # `dist/` is COMMITTED, because consumers install this over `github:` and there is no
      # `prepare` build. That was the old arrangement: `prepare: npm run build` compiled at every
      # consumer's install, which pylon abandoned after it broke installs (pylon#8). With dist/
      # checked in, the committed output IS the published artifact — so it has to be verified. If
      # someone edits api.ts and forgets to rebuild, every consumer silently gets stale code and
      # nothing anywhere complains.
      - name: committed dist/ must match a fresh build
        run: git diff --exit-code dist/ || (echo "::error::dist/ is stale — run 'pnpm exec tsc' and commit dist/" && exit 1)

      # Campfire's spec once dropped its security scheme, and four releases sent no Authorization
      # header without any build failing. This fails the build when any request goes out unauthenticated.
      - name: every request sends the Authorization header
        run: node scripts/check-auth.mjs

  # Install only, and only on a push to main. That is the sole cache write.
  pnpm-store:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
