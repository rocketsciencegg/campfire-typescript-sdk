name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Restores caches and cannot save them. `install` overrides this with `write`
# and runs only on a push to main, so a pull request cannot replace the
# default-branch pnpm store.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
cache-mode: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # Auto-cache only turns on for npm today. Keep it off so this job's
          # only cache is the exact pnpm-store key below.
          package-manager-cache: false
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Exact key, pnpm store only, no restore-keys. This action does not save.
      # `install` writes the same key.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc

      # `dist/` is COMMITTED, because consumers install this over `github:` and there is no
      # `prepare` build. That was the old arrangement: `prepare: npm run build` compiled at every
      # consumer's install, which pylon abandoned after it broke installs (pylon#8). With dist/
      # checked in, the committed output IS the published artifact — so it has to be verified. If
      # someone edits api.ts and forgets to rebuild, every consumer silently gets stale code and
      # nothing anywhere complains.
      - name: committed dist/ must match a fresh build
        run: git diff --exit-code dist/ || (echo "::error::dist/ is stale — run 'pnpm exec tsc' and commit dist/" && exit 1)

      # Campfire's spec once dropped its security scheme, and four releases sent no Authorization
      # header without any build failing. This fails the build when any request goes out unauthenticated.
      - name: every request sends the Authorization header
        run: node scripts/check-auth.mjs

  # Writes the pnpm store. Push to main only; the build job stays read-only even
  # on that push, so a later step there cannot replace the entry.
  install:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Same key as the build job. Saves on an exact-key miss only, and only
      # when install succeeds (actions/cache post-if is success()). No restore-keys.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
